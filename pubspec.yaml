name: gym_management_app
description: "Production-ready multi-tenant Gym Management SaaS built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  assets:
    - .env
